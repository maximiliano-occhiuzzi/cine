name: cine

services:

  auth-db:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=50"]
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-root_auth_pass}
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      MYSQL_DATABASE: auth_database
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  productos-db:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=50"]
    environment:
      MYSQL_ROOT_PASSWORD: ${PRODUCTOS_DB_ROOT_PASSWORD:-root_productos_pass}
      MYSQL_USER: productos_user
      MYSQL_PASSWORD: ${PRODUCTOS_DB_PASSWORD:-productos_pass}
      MYSQL_DATABASE: productos_database
    ports:
      - "3308:3306"
    volumes:
      - productos_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  salas-db:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=50"]
    environment:
      MYSQL_ROOT_PASSWORD: ${SALAS_DB_ROOT_PASSWORD:-root_salas_pass}
      MYSQL_USER: salas_user
      MYSQL_PASSWORD: ${SALAS_DB_PASSWORD:-salas_pass}
      MYSQL_DATABASE: salas_database
    ports:
      - "3309:3306"
    volumes:
      - salas_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ventas-db:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=50"]
    environment:
      MYSQL_ROOT_PASSWORD: ${VENTAS_DB_ROOT_PASSWORD:-root_ventas_pass}
      MYSQL_USER: ventas_user
      MYSQL_PASSWORD: ${VENTAS_DB_PASSWORD:-ventas_pass}
      MYSQL_DATABASE: ventas_database
    ports:
      - "3310:3306"
    volumes:
      - ventas_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  gmail-db:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=50"]
    environment:
      MYSQL_ROOT_PASSWORD: ${GMAIL_DB_ROOT_PASSWORD:-root_gmail_pass}
      MYSQL_USER: gmail_user
      MYSQL_PASSWORD: ${GMAIL_DB_PASSWORD:-gmail_pass}
      MYSQL_DATABASE: gmail_database
    ports:
      - "3311:3306"
    volumes:
      - gmail_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  factura-db:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=50"]
    environment:
      MYSQL_ROOT_PASSWORD: ${FACTURA_DB_ROOT_PASSWORD:-root_factura_pass}
      MYSQL_USER: factura_user
      MYSQL_PASSWORD: ${FACTURA_DB_PASSWORD:-factura_pass}
      MYSQL_DATABASE: factura_database
    ports:
      - "3312:3306"
    volumes:
      - factura_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  registry:
    image: maxmegafuego/cine-registry:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  configserver:
    image: maxmegafuego/cine-configserver:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      registry:
        condition: service_healthy
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8888'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  adminserver:
    image: maxmegafuego/cine-adminserver:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8090"
    depends_on:
      registry:
        condition: service_healthy
    restart: unless-stopped

  auth:
    image: maxmegafuego/cine-auth:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-7J3E+fmsIoAXFpZj26G8wX/L1rvBH9vG5FdumdIqVrU=}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-AXGstSXNH+4A1uVn2dPwfBSealCI1PSochtm/JjHfgE=}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
    ports:
      - "8086:8086"
    depends_on:
      configserver:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    restart: on-failure

  productos:
    image: maxmegafuego/cine-productos:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-AXGstSXNH+4A1uVn2dPwfBSealCI1PSochtm/JjHfgE=}
      PRODUCTOS_DB_PASSWORD: ${PRODUCTOS_DB_PASSWORD:-productos_pass}
    ports:
      - "8082:8082"
    depends_on:
      configserver:
        condition: service_healthy
      productos-db:
        condition: service_healthy
    restart: on-failure

  salas:
    image: maxmegafuego/cine-salas:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-AXGstSXNH+4A1uVn2dPwfBSealCI1PSochtm/JjHfgE=}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SALAS_DB_PASSWORD: ${SALAS_DB_PASSWORD:-salas_pass}
    ports:
      - "8083:8083"
    depends_on:
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      salas-db:
        condition: service_healthy
    restart: on-failure

  ventas:
    image: maxmegafuego/cine-ventas:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-AXGstSXNH+4A1uVn2dPwfBSealCI1PSochtm/JjHfgE=}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:?Falta MERCADOPAGO_ACCESS_TOKEN en el .env (token de prueba de tu cuenta de Mercado Pago Developers)}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL:-http://localhost:8081/ventas/webhook/mercadopago}
      VENTAS_DB_PASSWORD: ${VENTAS_DB_PASSWORD:-ventas_pass}
    ports:
      - "8084:8084"
    depends_on:
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ventas-db:
        condition: service_healthy
    restart: on-failure

  gmail:
    image: maxmegafuego/cine-gmail:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-AXGstSXNH+4A1uVn2dPwfBSealCI1PSochtm/JjHfgE=}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_DB_PASSWORD: ${GMAIL_DB_PASSWORD:-gmail_pass}
    ports:
      - "8085:8085"
    depends_on:
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      gmail-db:
        condition: service_healthy
    restart: on-failure

  factura:
    image: maxmegafuego/cine-factura:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-AXGstSXNH+4A1uVn2dPwfBSealCI1PSochtm/JjHfgE=}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      FACTURA_DB_PASSWORD: ${FACTURA_DB_PASSWORD:-factura_pass}
    ports:
      - "8087:8087"
    depends_on:
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      factura-db:
        condition: service_healthy
    restart: on-failure

  gateway:
    image: maxmegafuego/cine-gateway:latest
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-7J3E+fmsIoAXFpZj26G8wX/L1rvBH9vG5FdumdIqVrU=}
    ports:
      - "8081:8081"
    depends_on:
      configserver:
        condition: service_healthy
    restart: on-failure

  front:
    image: maxmegafuego/cine-front:latest
    ports:
      - "4200:80"
    depends_on:
      - gateway
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Falta NGROK_AUTHTOKEN en el .env}
    command:
      - "http"
      - "--url=https://${NGROK_DOMAIN}"
      - "gateway:8081"
    ports:
      - "4040:4040"
    depends_on:
      - gateway
    profiles: ["ngrok"]
    restart: unless-stopped

volumes:
  auth_db_data:
  productos_db_data:
  salas_db_data:
  ventas_db_data:
  gmail_db_data:
  factura_db_data: